<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Multi-stage ambient gold glow filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- Wide diffuse aura -->
      <feGaussianBlur stdDeviation="3.5" in="SourceAlpha" result="blur1" />
      <feFlood flood-color="#F59E0B" flood-opacity="0.65" result="color1" />
      <feComposite in2="blur1" operator="in" result="glow1" />

      <!-- Tight intense radiant glow -->
      <feGaussianBlur stdDeviation="1.5" in="SourceAlpha" result="blur2" />
      <feFlood flood-color="#FBBF24" flood-opacity="0.9" result="color2" />
      <feComposite in2="blur2" operator="in" result="glow2" />

      <!-- Merge glows with the source star -->
      <feMerge>
        <feMergeNode in="glow1" />
        <feMergeNode in="glow2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Rich vibrant 3D gold gradient for filled star -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Subtle top specular highlight -->
    <linearGradient id="specularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient background glow aura -->
  <circle cx="24" cy="24" r="16" fill="#F59E0B" opacity="0.22" filter="blur(4px)" />

  <!-- Smooth Rounded Filled Star with glowing filter -->
  <path
    d="M 24 6.5
       C 24.5 6.5, 25.1 7.2, 25.4 7.9
       L 29.8 17.0
       C 30.1 17.6, 30.7 18.0, 31.4 18.1
       L 41.4 19.5
       C 42.2 19.6, 42.7 20.4, 42.1 21.0
       L 34.8 28.1
       C 34.3 28.6, 34.1 29.3, 34.2 30.0
       L 36.0 40.0
       C 36.1 40.8, 35.3 41.4, 34.6 41.0
       L 25.7 36.3
       C 25.1 36.0, 24.3 36.0, 23.7 36.3
       L 14.8 41.0
       C 14.1 41.4, 13.3 40.8, 13.4 40.0
       L 15.2 30.0
       C 15.3 29.3, 15.1 28.6, 14.6 28.1
       L 7.3 21.0
       C 6.7 20.4, 7.2 19.6, 8.0 19.5
       L 18.0 18.1
       C 18.7 18.0, 19.3 17.6, 19.6 17.0
       L 24.0 7.9
       C 24.3 7.2, 24.9 6.5, 24 6.5 Z"
    fill="url(#goldGradient)"
    stroke="#F59E0B"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#starGlow)"
  />

  <!-- Inner rounded specular star gleam -->
  <path
    d="M 24 9.5
       L 28.2 18.0
       L 37.6 19.3
       L 30.8 25.9
       L 32.4 35.2
       L 24 30.8
       L 15.6 35.2
       L 17.2 25.9
       L 10.4 19.3
       L 19.8 18.0 Z"
    fill="url(#specularGrad)"
    opacity="0.35"
  />
</svg>
